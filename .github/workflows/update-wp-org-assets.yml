name: Update WordPress.org assets

# Déclenchement : push sur main qui touche les visuels ou le readme.
# Publie .wordpress-org/* dans assets/ et readme.txt dans trunk/ (et dans
# le tag du `Stable tag`), sans nouvelle version.
# Garde-fou : l'action s'arrête si autre chose que le readme et les assets
# diffère du trunk SVN. Le code ne part sur wp.org que par un tag vX.Y.Z.
# Attention : un readme poussé ici est en ligne tout de suite. Ne pas
# pousser sur main un readme préparé pour une version non encore taguée.
on:
  push:
    branches:
      - main
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'

jobs:
  assets:
    name: Push assets and readme to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mrz-gift-lists-exp
